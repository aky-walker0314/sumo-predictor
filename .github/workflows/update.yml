name: 予想を更新して公開

on:
  schedule:
    - cron: "30 10 * * *"   # 毎日 19:30 JST（取組終了・翌日の取組発表後）
    - cron: "0 23 * * *"    # 毎日 08:00 JST（取りこぼしの保険）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 過去データのキャッシュ（完了した場所のAPI応答）
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: データ取得・学習・予想・サイト生成
        run: python -m sumo.cli update

      - name: 新しい予想を保存（結果が出た後に書き換えられないよう履歴に残す）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predictions data/metrics.json
          git diff --cached --quiet || git commit -m "予想を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
